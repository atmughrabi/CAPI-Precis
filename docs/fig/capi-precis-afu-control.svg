<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc" fill="#3A414A">
  <title id="title">CAPI-Precis AFU-control block architecture</title>
  <desc id="desc">The host-facing PSL interface, grouped AFU-control protocol services, and application compute-unit interface. Boundary-local arrows show transfer direction without crossing internal blocks.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 13 11" markerWidth="13" markerHeight="11" refX="13" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L13 5.5 L0 11 Z" fill="#1071E5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 13 11" markerWidth="13" markerHeight="11" refX="13" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L13 5.5 L0 11 Z" fill="#008A0E"/>
    </marker>
    <style>
      :root{color-scheme:light dark}
      @media(prefers-color-scheme:dark){
        [fill="#3A414A"]{fill:#E7E2D9}[stroke="#3A414A"]{stroke:#E7E2D9}[stroke="#000000"]{stroke:#E7E2D9}
        [fill="#F7F4E4"]{fill:#24282B}[fill="#EDF5FF"],[fill="#C1E4F7"]{fill:#29363B}
        [fill="#D7FAF5"],[fill="#E3FAE3"]{fill:#28392C}[fill="#FFDDA6"],[fill="#FFF3D9"]{fill:#3D3526}
        [fill="#FFBBB1"],[fill="#FFD9D9"]{fill:#402B2D}[fill="#A7A6FF"],[fill="#DEDEFF"]{fill:#332F39}
        [fill="#1071E5"]{fill:#9CB8E8}[stroke="#1071E5"]{stroke:#9CB8E8}
        [fill="#008A0E"]{fill:#92C89A}[stroke="#008A0E"]{stroke:#92C89A}
      }
      .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:44px;font-weight:700}.subtitle{font-size:21px}.pane{font-size:28px;font-weight:700}
      .pane-small{font-size:25px;font-weight:700}.domain{font-size:14px;font-weight:700;letter-spacing:1px}
      .section{font-size:15px;font-weight:700;letter-spacing:.7px}.block{font-size:19px;font-weight:700}
      .body{font-size:17px}.small{font-size:15px}
    </style>
  </defs>

  <text x="50" y="65" class="sans title">AFU-control block architecture</text>
  <text x="50" y="100" class="sans subtitle">Protocol services are grouped by responsibility; arrows stay on the two external boundaries</text>
  <line x1="50" y1="126" x2="1550" y2="126" stroke="#3A414A" stroke-width="2"/>

  <rect x="50" y="175" width="220" height="675" rx="10" fill="#C1E4F7" stroke="#000000" stroke-width="3"/>
  <text x="160" y="207" text-anchor="middle" class="sans domain">HOST-FACING CAPI</text>
  <text x="160" y="246" text-anchor="middle" class="sans pane-small">PSL / PSLSE</text>
  <g class="sans body">
    <text x="80" y="305">job + MMIO</text>
    <text x="80" y="350">commands</text>
    <text x="80" y="520">responses</text>
    <text x="80" y="565">read cacheline</text>
    <text x="80" y="610">write cacheline</text>
  </g>
  <line x1="80" y1="655" x2="240" y2="655" stroke="#979EA8"/>
  <text x="80" y="690" class="sans small">coherent transport</text>
  <text x="80" y="718" class="sans small">or PSLSE simulation</text>

  <rect x="330" y="155" width="920" height="715" rx="10" fill="#E3FAE3" stroke="#000000" stroke-width="4"/>
  <text x="790" y="181" text-anchor="middle" class="sans domain">FPGA CONTROL DOMAIN</text>
  <text x="790" y="217" text-anchor="middle" class="sans pane">AFU control</text>

  <g class="sans">
    <text x="360" y="247" class="section">CONFIGURATION + OBSERVABILITY</text>
    <rect x="360" y="265" width="185" height="76" rx="8" fill="#DEDEFF" stroke="#000000" stroke-width="2"/>
    <text x="452" y="296" text-anchor="middle" class="block">WED control</text>
    <text x="452" y="322" text-anchor="middle" class="small">fetch + decode</text>
    <rect x="575" y="265" width="185" height="76" rx="8" fill="#DEDEFF" stroke="#000000" stroke-width="2"/>
    <text x="667" y="296" text-anchor="middle" class="block">MMIO</text>
    <text x="667" y="322" text-anchor="middle" class="small">config + status</text>
    <rect x="790" y="265" width="185" height="76" rx="8" fill="#FFD9D9" stroke="#000000" stroke-width="2"/>
    <text x="882" y="296" text-anchor="middle" class="block">Error control</text>
    <text x="882" y="322" text-anchor="middle" class="small">sticky report + ACK</text>
    <rect x="1005" y="265" width="185" height="76" rx="8" fill="#D7FAF5" stroke="#000000" stroke-width="2"/>
    <text x="1097" y="296" text-anchor="middle" class="block">Statistics</text>
    <text x="1097" y="322" text-anchor="middle" class="small">responses + bytes</text>

    <text x="360" y="387" class="section">ISSUE + RECOVERY</text>
    <rect x="360" y="405" width="185" height="76" rx="8" fill="#D7FAF5" stroke="#000000" stroke-width="2"/>
    <text x="452" y="436" text-anchor="middle" class="block">Credit control</text>
    <text x="452" y="462" text-anchor="middle" class="small">per command class</text>
    <rect x="575" y="405" width="185" height="76" rx="8" fill="#A7A6FF" stroke="#000000" stroke-width="2"/>
    <text x="667" y="436" text-anchor="middle" class="block">Tag control</text>
    <text x="667" y="462" text-anchor="middle" class="small">allocation + metadata</text>
    <rect x="790" y="405" width="185" height="76" rx="8" fill="#FFDDA6" stroke="#000000" stroke-width="2"/>
    <text x="882" y="436" text-anchor="middle" class="block">Command issue</text>
    <text x="882" y="462" text-anchor="middle" class="small">fixed / round robin</text>
    <rect x="1005" y="405" width="185" height="76" rx="8" fill="#FFDDA6" stroke="#000000" stroke-width="2"/>
    <text x="1097" y="436" text-anchor="middle" class="block">Restart</text>
    <text x="1097" y="462" text-anchor="middle" class="small">replay + flush</text>

    <text x="360" y="527" class="section">DATA + RESPONSE</text>
    <rect x="360" y="545" width="250" height="88" rx="8" fill="#C1E4F7" stroke="#000000" stroke-width="2"/>
    <text x="485" y="581" text-anchor="middle" class="block">Read-data control</text>
    <text x="485" y="608" text-anchor="middle" class="small">halves + destination routing</text>
    <rect x="645" y="545" width="250" height="88" rx="8" fill="#C1E4F7" stroke="#000000" stroke-width="2"/>
    <text x="770" y="581" text-anchor="middle" class="block">Write-data control</text>
    <text x="770" y="608" text-anchor="middle" class="small">buffer requests + halves</text>
    <rect x="930" y="545" width="260" height="88" rx="8" fill="#D7FAF5" stroke="#000000" stroke-width="2"/>
    <text x="1060" y="581" text-anchor="middle" class="block">Response control</text>
    <text x="1060" y="608" text-anchor="middle" class="small">classify + route by tag</text>

    <text x="360" y="681" class="section">COMPLETION + RESET</text>
    <rect x="450" y="700" width="280" height="92" rx="8" fill="#A7A6FF" stroke="#000000" stroke-width="2"/>
    <text x="590" y="738" text-anchor="middle" class="block">Done control</text>
    <text x="590" y="766" text-anchor="middle" class="small">snapshot - publish - ACK</text>
    <rect x="850" y="700" width="280" height="92" rx="8" fill="#FFF3D9" stroke="#000000" stroke-width="2"/>
    <text x="990" y="738" text-anchor="middle" class="block">Reset control</text>
    <text x="990" y="766" text-anchor="middle" class="small">hard + soft CU reset</text>
  </g>

  <text x="790" y="835" text-anchor="middle" class="sans small">ordered buffers and arbiters connect the services inside this boundary</text>

  <rect x="1310" y="175" width="240" height="675" rx="10" fill="#FFF3D9" stroke="#000000" stroke-width="3"/>
  <text x="1430" y="207" text-anchor="middle" class="sans domain">FPGA COMPUTE DOMAIN</text>
  <text x="1430" y="246" text-anchor="middle" class="sans pane-small">Compute units</text>
  <g class="sans">
    <rect x="1335" y="285" width="190" height="82" rx="8" fill="#FFBBB1" stroke="#000000" stroke-width="2"/>
    <text x="1430" y="333" text-anchor="middle" class="block">Read engines</text>
    <rect x="1335" y="405" width="190" height="82" rx="8" fill="#FFBBB1" stroke="#000000" stroke-width="2"/>
    <text x="1430" y="453" text-anchor="middle" class="block">Write engines</text>
    <rect x="1335" y="525" width="190" height="82" rx="8" fill="#FFBBB1" stroke="#000000" stroke-width="2"/>
    <text x="1430" y="573" text-anchor="middle" class="block">Compute kernel</text>
    <rect x="1335" y="675" width="190" height="82" rx="8" fill="#A7A6FF" stroke="#000000" stroke-width="2"/>
    <text x="1430" y="710" text-anchor="middle" class="block">Progress</text>
    <text x="1430" y="736" text-anchor="middle" class="small">status + done</text>
  </g>

  <g fill="none" stroke-width="3">
    <path d="M270 300 H330" stroke="#1071E5" marker-end="url(#arrow-blue)"/>
    <path d="M330 350 H270" stroke="#1071E5" marker-end="url(#arrow-blue)"/>
    <path d="M270 520 H330" stroke="#008A0E" marker-end="url(#arrow-green)"/>
    <path d="M270 565 H330" stroke="#008A0E" marker-end="url(#arrow-green)"/>
    <path d="M330 610 H270" stroke="#008A0E" marker-end="url(#arrow-green)"/>
  </g>

  <g fill="none" stroke-width="3">
    <path d="M1310 325 H1250" stroke="#1071E5" marker-end="url(#arrow-blue)"/>
    <path d="M1250 480 H1310" stroke="#008A0E" marker-end="url(#arrow-green)"/>
    <path d="M1310 710 H1250" stroke="#008A0E" marker-end="url(#arrow-green)"/>
    <path d="M1250 770 H1310" stroke="#1071E5" marker-end="url(#arrow-blue)"/>
  </g>

  <line x1="50" y1="910" x2="1550" y2="910" stroke="#979EA8"/>
  <circle cx="70" cy="948" r="8" fill="#1071E5"/>
  <text x="88" y="955" class="sans small">request / command / control</text>
  <circle cx="405" cy="948" r="8" fill="#008A0E"/>
  <text x="423" y="955" class="sans small">response / data / completion</text>
  <text x="1550" y="955" text-anchor="end" class="mono small">arrowheads show transfer direction at each boundary</text>
</svg>
