sudo: required
dist: jammy

before_install:
  - sudo apt-get update -qq
  - sudo apt-get install -y tcl
  - git submodule update --init --recursive

env: OMP_NUM_THREADS=4

language: c
compiler:
  - gcc

script:
  # GitHub Actions owns the Verilator 5.x RTL gate.
  - make rtl-manifest-verification accelerator-verification benchmark-verification integration-verification integration-compile test

notifications:
email:
  on_success: never
  on_failure: always
  recipients:
    - atmughrabi@gmail.com
    - atmughra@ncsu.edu

branches:
  only:
    - master